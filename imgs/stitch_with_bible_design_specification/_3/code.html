<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity">

</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">오늘의 말씀 인증</h1>

<main class="w-full max-w-[600px] mx-auto px-container-margin flex flex-col gap-xl pt-lg">
<!-- Info Section -->
<section class="bg-surface rounded-xl p-md shadow-[0px_4px_20px_rgba(23,32,51,0.04)]">
<h2 class="font-section-title text-section-title text-on-surface mb-xs">오늘 읽은 말씀</h2>
<p class="font-body-main text-body-main text-primary font-bold">마태복음 12-13장</p>
</section>
<!-- Photo Upload Area -->
<section class="flex flex-col gap-sm">
<div class="bg-surface rounded-xl p-md shadow-[0px_4px_20px_rgba(23,32,51,0.04)] flex flex-col items-center justify-center min-h-[300px] border-2 border-dashed border-outline-variant relative overflow-hidden group transition-all duration-300 hover:border-primary-fixed-dim">
<div class="flex flex-col items-center gap-md z-10 p-md text-center">
<span class="material-symbols-outlined text-4xl text-outline mb-2">add_a_photo</span>
<p class="font-body-main text-body-main text-on-surface-variant">읽은 성경 부분이 보이도록 촬영해주세요 (얼굴 제외)</p>
<div class="flex gap-sm mt-sm">
<button class="bg-secondary-fixed/20 text-secondary px-md py-xs rounded-full font-section-title text-section-title flex items-center gap-xs hover:bg-secondary-fixed/40 transition-colors">
<span class="material-symbols-outlined text-sm">photo_camera</span> 성경 사진 촬영
                        </button>
<button class="bg-surface-container-low text-on-surface-variant px-md py-xs rounded-full font-section-title text-section-title flex items-center gap-xs hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-sm">image</span> 사진 선택
                        </button>
</div>
</div>
</div>
</section>

            </label>
